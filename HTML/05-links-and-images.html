<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Links and Images</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <p>
        Hello! My name is Deepanshu.
        <br>
        I am learning HTML and Web Development.
    </p>

    <hr>

    <!-- Favourite Websites -->
    <h2>My Favourite Websites</h2>

    <a href="https://www.google.com"
       target="_blank"
       rel="noopener noreferrer">
        Visit Google
    </a>

    <br><br>

    <a href="https://www.youtube.com"
       target="_blank"
       rel="noopener noreferrer">
        Visit YouTube
    </a>

    <br><br>

    <a href="https://github.com"
       target="_blank"
       rel="noopener noreferrer">
        Visit GitHub
    </a>

    <hr>

    <!-- My Favourite Images -->
    <h2>My Favourite Images</h2>

    <img src="images/nature.jpg"
         alt="Beautiful nature"
         width="300">

    <br><br>

    <img src="images/profile.jpg"
         alt="My profile photo"
         width="200">

    <hr>

    <!-- Clickable Image -->
    <h2>Click on the Image</h2>

    <a href="https://www.google.com"
       target="_blank"
       rel="noopener noreferrer">

        <img src="images/nature.jpg"
             alt="Click to visit Google"
             width="300">

    </a>

</body>
</html>
