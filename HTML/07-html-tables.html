
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marksheet</title>

    <style>
        table {
            border-collapse: collapse;
            width: 80%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <!-- Main Heading -->
    <h1>Student Marksheet</h1>

    <!-- Student Information -->
    <h2>Student Details</h2>

    <p>Name: Deepanshu</p>
    <p>Course: BCA</p>
    <p>Semester: First Semester</p>

    <hr>

    <!-- Marks Table -->
    <h2>Subject-wise Marks</h2>

    <table>

        <thead>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
                <th>Maximum Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>HTML</td>
                <td>90</td>
                <td>100</td>
            </tr>

            <tr>
                <td>Python</td>
                <td>85</td>
                <td>100</td>
            </tr>

            <tr>
                <td>Computer</td>
                <td>88</td>
                <td>100</td>
            </tr>

            <tr>
                <td>English</td>
                <td>80</td>
                <td>100</td>
            </tr>

            <tr>
                <td>JavaScript</td>
                <td>95</td>
                <td>100</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Total</th>
                <th>438</th>
                <th>500</th>
            </tr>
        </tfoot>

    </table>

    <h2>Percentage: 87.6%</h2>

</body>
</html>
