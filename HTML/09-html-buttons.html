
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Buttons Project</title>
</head>
<body>

    <h1>Student Registration</h1>

    <form id="studentForm">

        <!-- Student Name -->
        <label for="name">Student Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required>

        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        <br><br>

        <!-- Submit Button -->
        <button type="submit">
            Submit Form
        </button>

        <!-- Reset Button -->
        <button type="reset">
            Reset Form
        </button>

    </form>

    <hr>

    <!-- Normal Button -->
    <h2>Normal Button</h2>

    <button type="button" id="clickButton">
        Click Me
    </button>

    <p id="message"></p>

    <hr>

    <!-- Disabled Button -->
    <h2>Disabled Button</h2>

    <input type="checkbox" id="terms">
    <label for="terms">
        I accept the terms and conditions
    </label>

    <br><br>

    <button type="button" id="registerButton" disabled>
        Register
    </button>

    <script>

        // Normal Button
        const clickButton =
            document.getElementById("clickButton");

        const message =
            document.getElementById("message");

        clickButton.addEventListener("click", function() {
            message.textContent = "Button clicked successfully!";
        });

        // Checkbox and Disabled Button
        const terms =
            document.getElementById("terms");

        const registerButton =
            document.getElementById("registerButton");

        terms.addEventListener("change", function() {
            registerButton.disabled = !terms.checked;
        });

        // Form Submit Demo
        const studentForm =
            document.getElementById("studentForm");

        studentForm.addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Student form submitted successfully!");
        });

    </script>

</body>
</html>
