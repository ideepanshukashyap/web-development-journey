
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favourite Places</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1, h2 {
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        iframe {
            max-width: 100%;
            border: 0;
        }
    </style>
</head>

<body>

    <h1>My Favourite Places Website</h1>

    <p>Welcome to my favourite places website!</p>

    <!-- Favourite Place -->
    <div class="container">
        <h2>1. My Favourite Place - Taj Mahal</h2>

        <iframe
            src="https://www.google.com/maps?q=Taj%20Mahal%20Agra&output=embed"
            width="600"
            height="350"
            title="Taj Mahal Location"
            loading="lazy"
            allowfullscreen>
        </iframe>
    </div>

    <!-- YouTube Video -->
    <div class="container">
        <h2>2. My Favourite Video</h2>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/VIDEO_ID"
            title="My Favourite YouTube Video"
            allow="fullscreen"
            allowfullscreen>
        </iframe>

        <p>Replace VIDEO_ID with your actual YouTube video ID.</p>
    </div>

    <!-- External Website -->
    <div class="container">
        <h2>3. External Website</h2>

        <iframe
            src="https://example.com"
            width="600"
            height="350"
            title="Example External Website"
            loading="lazy">
        </iframe>
    </div>

</body>
</html>
